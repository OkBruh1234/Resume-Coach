services:
  backend_fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend_fastapi:/app
    env_file:
      - ./backend_fastapi/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resumecoach}
      POSTGRES_USER: ${POSTGRES_USER:-resumecoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumecoach_dev}
    depends_on:
      postgres:
        condition: service_healthy

  frontend_react:
    build: ./frontend_react
    ports:
      - "3000:80"
    depends_on:
      - backend_fastapi

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resumecoach}
      POSTGRES_USER: ${POSTGRES_USER:-resumecoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumecoach_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
